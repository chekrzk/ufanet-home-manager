syntax = "proto3";

package ufanet.home_manager.profile.v1;

option go_package = "github.com/chekrzk/ufanet-home-manager/contracts/gen/go/profile/v1;profilev1";

import "common/v1/common.proto";

service ProfileService {
  rpc Me(MeRequest) returns (ufanet.home_manager.common.v1.User);
  rpc Update(UpdateProfileRequest) returns (ufanet.home_manager.common.v1.User);
  rpc AddWorker(AddWorkerRequest) returns (ufanet.home_manager.common.v1.Worker);
  rpc ListWorkers(ListWorkersRequest) returns (ListWorkersResponse);
  rpc SetWorkerAvailability(SetWorkerAvailabilityRequest) returns (ufanet.home_manager.common.v1.WorkerAvailability);
  rpc ListWorkerAvailability(ListWorkerAvailabilityRequest) returns (ListWorkerAvailabilityResponse);
}

message MeRequest {
  ufanet.home_manager.common.v1.UserContext user = 1;
}

message UpdateProfileRequest {
  ufanet.home_manager.common.v1.UserContext user = 1;
  string full_name = 2;
  string apartment = 3;
  string house_id = 4;
}

message AddWorkerRequest {
  ufanet.home_manager.common.v1.UserContext actor = 1;
  string user_id = 2;
  string full_name = 3;
  string specialization = 4;
  string phone = 5;
  string house_id = 6;
}

message ListWorkersRequest {
  ufanet.home_manager.common.v1.UserContext actor = 1;
  string house_id = 2;
}

message ListWorkersResponse {
  repeated ufanet.home_manager.common.v1.Worker items = 1;
}

message SetWorkerAvailabilityRequest {
  ufanet.home_manager.common.v1.UserContext worker = 1;
  string specialization = 2;
  string house_id = 3;
  string available_date = 4;
  string available_time = 5;
}

message ListWorkerAvailabilityRequest {
  ufanet.home_manager.common.v1.UserContext actor = 1;
  string specialization = 2;
  string house_id = 3;
  string available_date = 4;
}

message ListWorkerAvailabilityResponse {
  repeated ufanet.home_manager.common.v1.WorkerAvailability items = 1;
}
