syntax = "proto3";

package ufanet.home_manager.common.v1;

option go_package = "github.com/chekrzk/ufanet-home-manager/contracts/gen/go/common/v1;commonv1";

import "google/protobuf/timestamp.proto";

message Empty {}

message UserContext {
  string user_id = 1;
  string role = 2;
}

message Pagination {
  int32 page = 1;
  int32 limit = 2;
}

message User {
  string id = 1;
  string phone = 2;
  string full_name = 3;
  string role = 4;
  string house_id = 5;
  string apartment = 6;
}

message News {
  string id = 1;
  string title = 2;
  string body = 3;
  string house_id = 4;
  google.protobuf.Timestamp created_at = 5;
}

message MaintenanceRequest {
  string id = 1;
  string user_id = 2;
  string category = 3;
  string description = 4;
  string status = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  string assigned_to = 8;
  string preferred_date = 9;
  string address = 10;
  string apartment = 11;
  string phone = 12;
  google.protobuf.Timestamp accepted_at = 13;
  google.protobuf.Timestamp declined_at = 14;
  google.protobuf.Timestamp completed_at = 15;
}

message Worker {
  string id = 1;
  string user_id = 2;
  string full_name = 3;
  string specialization = 4;
  string phone = 5;
  string house_id = 6;
  google.protobuf.Timestamp created_at = 7;
}

message WorkerAvailability {
  string id = 1;
  string worker_id = 2;
  string user_id = 3;
  string specialization = 4;
  string house_id = 5;
  string available_date = 6;
  string available_time = 7;
  google.protobuf.Timestamp created_at = 8;
}

message Notification {
  string id = 1;
  string user_id = 2;
  string house_id = 3;
  string type = 4;
  string title = 5;
  string body = 6;
  string entity_id = 7;
  bool read = 8;
  google.protobuf.Timestamp created_at = 9;
}
