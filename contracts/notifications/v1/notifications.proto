syntax = "proto3";

package ufanet.home_manager.notifications.v1;

option go_package = "github.com/chekrzk/ufanet-home-manager/contracts/gen/go/notifications/v1;notificationsv1";

import "common/v1/common.proto";

service NotificationsService {
  rpc RegisterDevice(RegisterDeviceRequest) returns (ufanet.home_manager.common.v1.Empty);
  rpc UnregisterDevice(UnregisterDeviceRequest) returns (ufanet.home_manager.common.v1.Empty);
  rpc Publish(PublishNotificationRequest) returns (ufanet.home_manager.common.v1.Empty);
  rpc ListNotifications(ListNotificationsRequest) returns (ListNotificationsResponse);
  rpc MarkRead(MarkReadRequest) returns (ufanet.home_manager.common.v1.Empty);
}

message RegisterDeviceRequest {
  ufanet.home_manager.common.v1.UserContext user = 1;
  string token = 2;
  string platform = 3;
}

message UnregisterDeviceRequest {
  ufanet.home_manager.common.v1.UserContext user = 1;
  string token = 2;
}

message PublishNotificationRequest {
  string user_id = 1;
  string house_id = 2;
  string type = 3;
  string title = 4;
  string body = 5;
  string entity_id = 6;
}

message ListNotificationsRequest {
  ufanet.home_manager.common.v1.UserContext user = 1;
  ufanet.home_manager.common.v1.Pagination pagination = 2;
}

message ListNotificationsResponse {
  repeated ufanet.home_manager.common.v1.Notification items = 1;
  int32 page = 2;
  int32 limit = 3;
  int32 total = 4;
}

message MarkReadRequest {
  ufanet.home_manager.common.v1.UserContext user = 1;
  string notification_id = 2;
}
