syntax = "proto3";

package ufanet.home_manager.news.v1;

option go_package = "github.com/chekrzk/ufanet-home-manager/contracts/gen/go/news/v1;newsv1";

import "common/v1/common.proto";

service NewsService {
  rpc ListNews(ListNewsRequest) returns (ListNewsResponse);
  rpc CreateNews(CreateNewsRequest) returns (ufanet.home_manager.common.v1.News);
}

message ListNewsRequest {
  ufanet.home_manager.common.v1.UserContext user = 1;
  ufanet.home_manager.common.v1.Pagination pagination = 2;
  string date_from = 3;
  string date_to = 4;
}

message ListNewsResponse {
  repeated ufanet.home_manager.common.v1.News items = 1;
  int32 page = 2;
  int32 limit = 3;
  int32 total = 4;
}

message CreateNewsRequest {
  ufanet.home_manager.common.v1.UserContext author = 1;
  string title = 2;
  string body = 3;
  string house_id = 4;
}

